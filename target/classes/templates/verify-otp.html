<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP &bull; EduTrack</title>
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .otp-input-group {
            position: relative;
        }
        .otp-input-group .field-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            z-index: 10;
        }
        .form-control-portal {
            padding-left: 3rem !important;
            font-size: 1.25rem;
            letter-spacing: 0.25rem;
            text-align: center;
            font-weight: 600;
        }
        .timer-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 10px;
        }
        .otp-boxes {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .otp-box {
            width: 50px;
            height: 60px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: all 0.2s ease;
        }
        .otp-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
        }
    </style>
</head>
<body class="login-page-body">

<div class="login-portal-card" style="max-width: 500px;">
    <div class="py-4 px-4 px-md-5">
        
        <div class="text-center mb-4">
            <div class="brand-emblem mx-auto mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="portal-heading fs-4">Two-Step Verification</h2>
            <p class="portal-subheading">
                We've sent a 6-digit one-time password to your registered email <strong th:text="${maskedEmail}">your email</strong>.
            </p>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMessage}" class="portal-alert portal-alert-success" role="alert">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <span th:text="${successMessage}">OTP sent successfully.</span>
        </div>

        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="portal-alert portal-alert-danger" role="alert">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
            <span th:text="${errorMessage}">Invalid OTP.</span>
        </div>

        <form th:action="@{/verify-otp}" method="post" id="otpForm">
            <div class="mb-4">
                <label class="form-label field-label text-center d-block mb-3">ENTER OTP CODE</label>
                <div class="otp-boxes">
                    <input type="text" class="otp-box" maxlength="1" required autofocus autocomplete="off">
                    <input type="text" class="otp-box" maxlength="1" required autocomplete="off">
                    <input type="text" class="otp-box" maxlength="1" required autocomplete="off">
                    <input type="text" class="otp-box" maxlength="1" required autocomplete="off">
                    <input type="text" class="otp-box" maxlength="1" required autocomplete="off">
                    <input type="text" class="otp-box" maxlength="1" required autocomplete="off">
                </div>
                <input type="hidden" name="otp" id="finalOtp">
            </div>

            <button type="submit" class="btn-portal-primary w-100 mb-3" id="btnVerify">
                <span>Verify & Proceed</span>
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </form>

        <form th:action="@{/resend-otp}" method="post" id="resendForm">
            <div class="text-center timer-text">
                Didn't receive the code? 
                <button type="submit" class="btn btn-link p-0 text-decoration-none fw-semibold" id="resendBtn">Resend OTP</button>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const boxes = document.querySelectorAll('.otp-box');
        const form = document.getElementById('otpForm');
        const finalOtp = document.getElementById('finalOtp');

        boxes.forEach((box, index) => {
            // Auto focus next box
            box.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                }
            });

            // Handle backspace
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        boxes[index - 1].focus();
                    }
                }
            });

            // Handle paste
            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
                if (/^\d{1,6}$/.test(pastedData)) {
                    const chars = pastedData.split('');
                    chars.forEach((char, i) => {
                        if (boxes[index + i]) {
                            boxes[index + i].value = char;
                        }
                    });
                    const focusIndex = Math.min(index + chars.length, boxes.length - 1);
                    boxes[focusIndex].focus();
                }
            });
        });

        form.addEventListener('submit', () => {
            let otpStr = '';
            boxes.forEach(box => otpStr += box.value);
            finalOtp.value = otpStr;
        });
    });
</script>
</body>
</html>
